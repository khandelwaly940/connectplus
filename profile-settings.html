<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Settings | Connect+</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="main-header">
        <div class="logo">Connect+</div>
        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a href="reports.html">Reports</a>
            <a href="profile-settings.html">Profile Settings</a>
            <a href="index.html">Logout</a>
        </nav>
    </header>
    <main class="profile-settings-container">
        <h1>Profile Settings</h1>
        <form action="#" method="post">
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="Enter your name" value="Admin" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" value="admin@connectplus.com" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter a new password">
            </div>
            <button type="submit" class="cta">Save Changes</button>
        </form>
    </main>
    <footer>
        <p>© 2024 Connect+. All rights reserved.</p>
    </footer>
</body>
</html>
