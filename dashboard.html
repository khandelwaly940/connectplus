<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Connect+</title>
    <link rel="stylesheet" href="css/style.css">
    <script defer src="js/script.js"></script>
</head>
<body>
    <header class="main-header">
        <div class="logo">
            <img src="Connect.png" alt="Connect+ Logo">
        </div>
        
        <nav>
            <a href="dashboard.html" class="active">Dashboard</a>
            <a href="reports.html">Reports</a>
            <a href="profile-settings.html">Profile Settings</a>
            <a href="index.html">Logout</a>
        </nav>
    </header>
    
    <main class="dashboard-container">
        <h1>Welcome to Your Dashboard</h1>
        <p>Track your progress, manage your learning paths, and set study schedules.</p>
        
        <!-- Course Selection -->
        <section id="course-selection">
            <h2>Course Selection</h2>
            <select id="course-dropdown">
                <option value="dsa">Data Structures & Algorithms</option>
                <option value="web-dev">Web Development</option>
                <option value="ml">Machine Learning</option>
            </select>
            <button id="select-course-btn">Done</button>
        </section>
    
        <!-- Time & Calendar Selection -->
        <section id="schedule-section">
            <h2>Schedule Study Time</h2>
            <label for="study-time">Select Time:</label>
            <input type="time" id="study-time">
            
            <label for="study-date">Select Date:</label>
            <input type="date" id="study-date">
            
            <button id="set-time-btn">Save Schedule</button>
            <button id="google-calendar-btn">Add to Google Calendar</button>
        </section>

        <!-- Learning Path -->
        <section id="learning-path">
            <h2>Learning Path</h2>
            <p>Select a course to view the learning path.</p>
            <ul id="path-list">
                <!-- Dynamic learning steps will be inserted here -->
            </ul>
        </section>
    </main>

    <footer>
        <p>© 2024 Connect+. All rights reserved.</p>
    </footer>
