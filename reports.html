<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports | Connect+</title>
    <link rel="stylesheet" href="css/style.css">
    <script defer src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script defer src="js/reports.js"></script>
</head>
<body>
    <header class="main-header">
        <div class="logo">Connect+</div>
        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a href="reports.html" class="active">Reports</a>
            <a href="profile-settings.html">Profile Settings</a>
            <a href="index.html">Logout</a>
        </nav>
    </header>

    <main class="reports-container">
        <h1>Your Reports</h1>
        <p>Analyze your learning progress with detailed insights and charts.</p>

        <!-- Roadmap Section -->
        <section class="roadmap-section">
            <h2>Your Learning Roadmaps</h2>
            <div id="roadmap-container"></div>
        </section>

        <!-- Charts Section -->
        <section class="charts-section">
            <h2>Learning Progress Overview</h2>
            <div class="chart-container">
                <canvas id="progressChart"></canvas>
            </div>
            <div class="chart-container">
                <canvas id="skillsChart"></canvas>
            </div>
        </section>
    </main>

    <footer>
        <p>© 2024 Connect+. All rights reserved.</p>
    </footer>
</body>
</html>
